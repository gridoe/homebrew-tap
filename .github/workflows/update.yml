name: Update

# Once a day, and by hand: move Casks/refryt.rb to Refryt's latest release, with the DMG's hash
# from that release's SHA256SUMS file, and commit it if anything changed.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo gridoe/refryt --json tagName --jq .tagName)"
          version="${tag#v}"
          sums="$(gh release download "$tag" --repo gridoe/refryt --pattern "refryt-$version-SHA256SUMS.txt" --output -)"
          dmg="$(echo "$sums" | awk -v f="refryt-$version-macos-arm64.dmg" '$2 == f { print $1 }')"
          [ -n "$dmg" ] || { echo "::error::no DMG hash in $tag's SHA256SUMS"; exit 1; }
          sed -i -E "s/^  version \"[^\"]+\"/  version \"$version\"/; s/^  sha256 \"[0-9a-f]+\"/  sha256 \"$dmg\"/" Casks/refryt.rb
          if git diff --quiet; then
            echo "already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "refryt $version"
          git push
